# Light workspace with restrained indigo accents.
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F8"
textColor = "#172B4D"
linkColor = "#4338CA"
borderColor = "#DFE6F0"
codeBackgroundColor = "#EEF2FF"
baseRadius = "medium"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#F0F4FA"

[client]
toolbarMode = "viewer"
