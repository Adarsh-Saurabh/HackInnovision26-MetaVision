[project]
name = "hackinnovision26-metavision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.3.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
